name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PollSurvey.sln

      - name: Check formatting
        run: dotnet format whitespace PollSurvey.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PollSurvey.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PollSurvey.sln --configuration Release --no-build
