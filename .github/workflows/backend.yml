name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PollSurvey.sln

      - name: Check formatting
        run: dotnet format whitespace PollSurvey.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PollSurvey.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PollSurvey.sln --configuration Release --no-build

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        include:
          - image: poll-api-gateway
            dockerfile: src/ApiGateway/Dockerfile
          - image: poll-service
            dockerfile: src/PollService/Dockerfile
          - image: voting-service
            dockerfile: src/VotingService/Dockerfile
          - image: realtime-service
            dockerfile: src/RealtimeService/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
