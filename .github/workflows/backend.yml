name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PollSurvey.sln

      - name: Static analysis
        run: dotnet format PollSurvey.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PollSurvey.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PollSurvey.sln --configuration Release --no-build

  containers:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: poll-api-gateway
            dockerfile: src/ApiGateway/Dockerfile
          - image: poll-service
            dockerfile: src/PollService/Dockerfile
          - image: voting-service
            dockerfile: src/VotingService/Dockerfile
          - image: realtime-service
            dockerfile: src/RealtimeService/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, matrix.image) || format('local/{0}:ci', matrix.image) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: containers
    runs-on: ubuntu-latest
    env:
      PAAS_DEPLOY_HOOK_URL: ${{ secrets.PAAS_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger PaaS deployment
        run: |
          test -n "$PAAS_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent --request POST "$PAAS_DEPLOY_HOOK_URL"
